title: "JSEE"
description: > # this means to ignore newlines until "show_excerpts:"
  JavaScript Execution Environment

show_excerpts: false

logo_header:
  src: https://jsee.io/design/jsee_logo.svg
  href: https://jsee.org/
  width: 70

logo_footer:
  src: https://jsee.io/design/jsee_logo.svg
  href: https://jsee.org/
  width: 50

header_pages:
  -

minima:
  social_links:
    twitter: jseeio
    facebook: jseeio
    github: jseeio

remote_theme: "jseeio/minima"

# The theme's page layout supplies the heading sidebar and copy/download controls.
defaults:
  - scope:
      path: "README.md"
    values:
      layout: page
      title: JSEE
      show_title: false
      permalink: /
  - scope:
      path: "py/README.md"
    values:
      layout: page
      title: JSEE for Python
      show_title: false
      permalink: /py/
