<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scores · JSEE</title>
<style>body { margin: 24px; font-family: system-ui, sans-serif; } main { max-width: 900px; margin: auto; } nav { margin-bottom: 20px; }</style>
<main>
<nav><label for="scheme">Color scheme</label> <select id="scheme"><option value="auto">System</option><option value="light">Light</option><option value="dark">Dark</option></select></nav>
<div id="app"></div>
</main>
<script src="./dist/jsee.core.js"></script>
<script>
  const app = new JSEE({ container: '#app', schema: 'schema.json' })
  document.getElementById('scheme').onchange = event => app.setDesign({ colorScheme: event.target.value })
</script>
</html>
