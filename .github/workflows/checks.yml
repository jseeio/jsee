name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install
      - run: python -m pip install pytest build wheel
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run build
      - run: npm run test:python-native
      - run: npm run test:python
      - run: python -m pip install -r test/python/requirements.txt
      - run: npm run test:python-apps-native
      - run: npm run test:ml
      - run: npm run test:probes
      - run: python -m build py
