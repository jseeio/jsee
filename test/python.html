<html>
  <div id="jsee-container">
  <script src="/dist/jsee.core.js"></script>
  <script>
    window.app = new JSEE({
      schema: {
        "model": {
          "name": "pytest",
          "type": "py",
          "description": "Testing pyodide project",
          "container": "object",
          "code": `
            import numpy as np
            from js import a, b, location as js_location
            assert inputs["location"] == "earth"
            assert str(js_location) != "earth"
            np.mean([a, b])
          `.replace(/^\s+/gm, ''),
          "autorun": false,
          "worker": true,
          "pyodide": {
            "url": "/tmp/test-assets/pyodide-314.0.7/pyodide.mjs",
            "indexURL": "/tmp/test-assets/pyodide-314.0.7/"
          },
          "imports": [
            "numpy"
          ]
        },
        "inputs": [
          {
            "type": "int",
            "name": "a"
          },
          {
            "type": "int",
            "name": "b"
          },
          {
            "type": "string",
            "name": "location",
            "default": "earth"
          }
        ],
        "outputs": [
          {
            "type": "int"
          }
        ]
      }
    })
  </script>
</html>
